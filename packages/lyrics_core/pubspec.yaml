name: tekaly_lyrics_core
description: >-
  Lyrics for karaoke and songbooks: a cv model in media milliseconds, LRC,
  SRT/WebVTT, text and ChordPro formats, timing, play ranges, the timing
  editor logic. Pure Dart.
version: 0.1.0
publish_to: none

resolution: workspace
environment:
  sdk: ^3.12.0

dependencies:
  cv: ">=1.1.11"

dev_dependencies:
  test: ">=1.31.0"
  tekartik_lints:
    git:
      url: https://github.com/tekartik/common.dart
      path: packages/lints
    version: '>=0.1.0'
