name: tekaly_lyrics_view
description: >-
  Karaoke and songbook display of tekaly_lyrics_core lyrics: KaraokeLyricsView
  (page or scroll, syllable wipe, lead-in dots) and SongbookLyricsView (chords
  above the syllables, transpose).
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.12.0
  flutter: ">=1.17.0"

dependencies:
  flutter:
    sdk: flutter
  tekaly_lyrics_core:
    git:
      url: https://github.com/tekartikprj/music
      path: packages/lyrics_core
    version: '>=0.1.0'

dev_dependencies:
  flutter_test:
    sdk: flutter
  tekartik_lints_flutter:
    git:
      url: https://github.com/tekartik/common_flutter.dart
      path: packages/lints_flutter

resolution: workspace
